; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino, espidf

extra_scripts = pre:patch_esp_timer.py
                pre:generate_cert.py
                strip_web_assets.py
                extra_script.py


monitor_speed = 115200

board_build.sdkconfig = sdkconfig.defaults
; SPIFFS no longer used anywhere in this codebase (the web remote's
; html/js/css moved to flash-resident const arrays -- see
; WebRemoteHandler.cpp / strip_web_assets.py). no_spiffs.csv is
; min_spiffs.csv with the spiffs partition simply removed, not reclaimed by
; anything else.
board_build.partitions = no_spiffs.csv
board_build.flash_size = 4MB


build_unflags =
    -Wall
    -Werror=all
    -Wextra


build_flags =
    -DESP_TIMER_TASK_CORE=1  # Sensor core: 1=APP_CPU (isolated from WiFi/lwIP). Must match patch in esp_timer.c.
    -DCORE_DEBUG_LEVEL=0  # Change the log level (0 = ERROR, 1 = WARN, 2 = INFO, 3 = DEBUG)
    -DLOG_LOCAL_LEVEL=0  # Set the local log level for application-specific logs
    -DCERT_EMBEDDED
    -Wall
    -Wextra
    -Wno-error=switch
    -Wno-error=return-type
    -Wno-error=unused-parameter
    -std=gnu++11
    -DELEGANTOTA_USE_ASYNC_WEBSERVER
    -DCMAKE_BUILD_TYPE=Release
    -DMQTT_MAX_PACKET_SIZE=512


; lib_ignore for BluetoothSerial/ESP32 BLE Arduino removed (2026-08-13):
; all Bluetooth/BLE code (previously dead behind #ifdef ALLOW_BLUETOOTH/
; ALLOW_BLE, both permanently undefined) was deleted outright from
; FPA422Handler.h/.cpp -- it never worked on this hardware and never will
; (BLE and WiFi don't coexist well here anyway, shared radio; WiFi is the
; only path this project actually uses). Nothing left in source that could
; pull either library in, so the exclusion is moot.

lib_deps =

    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/ayushsharma82/ElegantOTA
    https://github.com/MajicDesigns/MD_MAX72XX
    ; tzapu/WiFiManager removed 2026-08-13 -- replaced by
    ; CaptivePortal/AppSettings/WiFiConnect (see those source files),
    ; which share this project's own AsyncWebServer instance instead of
    ; running a separate blocking WebServer, and don't freeze the device
    ; for up to 120s while the portal is active. Was two duplicate
    ; entries here before removal (this pinned version, plus an unpinned
    ; git-URL duplicate a few lines down) -- pre-existing mess, not
    ; something introduced by the removal.
    ; Pinned to 6.x, not 7.x -- see docs/HEAP_FIX_IMPLEMENTATION_PLAN.md
    ; (Branch 2 / Option A). v7's StaticJsonDocument<N> is a deprecated
    ; compatibility shim that's actually heap-backed via malloc() despite
    ; the name (confirmed by reading ArduinoJson's own source) -- every
    ; OPP2 publish (opp2_serialize.h, all 12 message types) was allocating
    ; on every single state change. v6's StaticJsonDocument<N> is genuinely
    ; fixed/stack-resident, which is what this dependency was originally
    ; chosen for. OPP2 library (opp2_serialize.h/opp2_deserialize.h) only
    ; uses the old-style API, confirmed no v7-only features anywhere in it
    ; -- this pin needed zero changes there. v6 is EOL upstream (no further
    ; updates) -- accepted tradeoff for a narrow, stable job (fixed JSON
    ; schemas that aren't changing). TierAProvisioning.cpp's two real
    ; JsonDocument (v7-only name) uses were ported to DynamicJsonDocument
    ; (heap, not StaticJsonDocument<N>/stack -- this path carries a CSR and,
    ; on response, two PEM certificates, too large to size safely on the
    ; MQTT event-handler task's stack; fires at most once per device
    ; lifetime, unlike the per-state-change OPP2 path this pin exists for)
    ; to build under this pin.
    bblanchon/ArduinoJson @ ^6.21.0
    ; opp2-library's VideoReview serializer used one v7-only ArduinoJson
    ; construct (JsonArray::add<JsonObject>()), which broke compilation
    ; under the v6 pin above. Fixed upstream (commit eb5e5f6, 2026-08-13:
    ; swapped to createNestedObject(), present and functional in both v6
    ; and v7) -- no longer needs a local symlink override.
    ; Pinned to a commit, not left tracking main -- unpinned, this URL let
    ; opp2-library drift silently with zero trace in this repo's git log.
    ; That's exactly how JSON_SIZE_LIGHTS=128 (too small for ArduinoJson v6's
    ; fixed-capacity StaticJsonDocument -- it silently dropped the "left"
    ; side of every lights MQTT message, {} instead of real data, no error)
    ; went unnoticed: this project builds against the v6 pin above, but
    ; opp2-library's own tests run under v7 (see its platformio.ini), whose
    ; StaticJsonDocument compat shim doesn't reproduce v6's rigid capacity
    ; behavior -- so the bug was invisible upstream. Fixed in 8879e18
    ; (JSON_SIZE_LIGHTS 128 -> 384, verified empirically against v6.21.6).
    ; cafe76b followed up with the same audit for every other message type,
    ; this time verified directly on real ESP32 hardware rather than native
    ; (ArduinoJson's VariantSlot is 16 bytes on the real 32-bit target vs 32
    ; on 64-bit desktop, so native alone understates how much room there
    ; actually is -- and in two cases, SCORE and UW2F, overstates it: those
    ; were fine on-device but had near-zero margin). CONNECTION, MATCH, and
    ; VIDEO_REVIEW were confirmed silently dropping fields on real hardware
    ; at their old sizes.
    ; Bump this pin deliberately when picking up future upstream changes,
    ; not implicitly on the next clean build.
    https://github.com/OpenPiste/opp2-library.git#cafe76b4f1228325094d3a9e91c0f8aced2ac053


