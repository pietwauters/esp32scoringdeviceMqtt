; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino, espidf

extra_scripts = pre:patch_esp_timer.py
                pre:generate_cert.py
                strip_web_assets.py
                extra_script.py


monitor_speed = 115200

board_build.sdkconfig = sdkconfig.defaults
; SPIFFS no longer used anywhere in this codebase (the web remote's
; html/js/css moved to flash-resident const arrays -- see
; WebRemoteHandler.cpp / strip_web_assets.py). no_spiffs.csv is
; min_spiffs.csv with the spiffs partition simply removed, not reclaimed by
; anything else.
board_build.partitions = no_spiffs.csv
board_build.flash_size = 4MB


build_unflags =
    -Wall
    -Werror=all
    -Wextra


build_flags =
    -DESP_TIMER_TASK_CORE=1  # Sensor core: 1=APP_CPU (isolated from WiFi/lwIP). Must match patch in esp_timer.c.
    -DCORE_DEBUG_LEVEL=0  # Change the log level (0 = ERROR, 1 = WARN, 2 = INFO, 3 = DEBUG)
    -DLOG_LOCAL_LEVEL=0  # Set the local log level for application-specific logs
    -DCERT_EMBEDDED
    -Wall
    -Wextra
    -Wno-error=switch
    -Wno-error=return-type
    -Wno-error=unused-parameter
    -std=gnu++11
    -DELEGANTOTA_USE_ASYNC_WEBSERVER
    -DCMAKE_BUILD_TYPE=Release
    -DMQTT_MAX_PACKET_SIZE=512


; BluetoothSerial/ESP32 BLE Arduino excluded (2026-08-12): unused (the only
; #includes for them, in FPA422Handler.cpp, are behind #ifdef ALLOW_BLUETOOTH
; /ALLOW_BLE, both undefined) and confirmed absent from the linked firmware
; already (checked firmware.elf's symbol table directly -- zero BT/BLE
; symbols, so this changes build time only, not runtime RAM/flash). BLE and
; WiFi don't coexist well on this hardware anyway (shared radio), and WiFi
; is the path this project actually uses -- lib_ignore stops PlatformIO's
; dependency finder from compiling either library at all on every build.
lib_ignore =
    BluetoothSerial
    ESP32 BLE Arduino

; Fix double lib_deps and spacing
lib_deps =
    
    tzapu/WiFiManager@^2.0.17
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/ayushsharma82/ElegantOTA
    https://github.com/MajicDesigns/MD_MAX72XX
    https://github.com/tzapu/WiFiManager
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/OpenPiste/opp2-library


